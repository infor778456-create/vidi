name: Build Vidi Web App (PWA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Unpack Vidi Source Files & Build Web
        shell: bash
        run: |
          flutter create --platforms=web --org com.hussain --project-name vidi vidi_build
          cd vidi_build
          mkdir -p assets/fonts
          FONT_SRC=$(find /usr/share/fonts -name "*.ttf" | head -n 1)
          for w in Regular Medium SemiBold Bold ExtraBold; do
            cp "$FONT_SRC" "assets/fonts/AppFont-$w.ttf"
          done
          awk '/EOF_PAYLOAD/{flag=!flag; next} flag' ../.github/workflows/build_apk.yml | tr -d " \n\r" | base64 -d | tar -xJ -f -
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidi-web-release
          path: vidi_build/build/web/*
