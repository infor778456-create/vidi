          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$d"
            cp ic_launcher_master.png "android/app/src/main/res/$d/ic_launcher.png"
            cp ic_launcher_master.png "android/app/src/main/res/$d/ic_launcher_round.png"
          done
          rm -f ic_launcher_master.png

      # ========================================================================
      # الخطوة الرابعة: تحميل مكتبات المشروع وبناء ملف APK النهائي وتوقيعه رقمياً
      # (التوقيع الرقمي يزيل شهادة الاختبار التجريبية Debug ويعتمد شهادة إصدار رسمية)
      # ========================================================================
      - name: Build & Sign Release APK (بناء وتوقيع ملف الـ APK النهائي)
        working-directory: vidi_build
        shell: bash
        run: |
          # تحميل الحزم المذكورة في pubspec.yaml
          flutter pub get

          # بناء نسخة Release عالية الأداء
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "../$APK_FILE_NAME"

          # إنشاء شهادة توقيع رقمي رسمية باسم المطور وتوقيع ملف الـ APK بها بشكل آمن
          rm -f release.jks
          keytool -genkeypair -v -keystore release.jks -alias vidi_release -keyalg RSA -keysize 2048 -validity 10000 -storepass vidi2026pass -keypass vidi2026pass -dname "CN=Hussain Al-dmini, OU=AppDev, O=vidi, L=Sanaa, S=Sanaa, C=YE" || true
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/build-tools" ] && [ -f "release.jks" ]; then
            APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" sign --ks release.jks --ks-key-alias vidi_release --ks-pass pass:vidi2026pass --key-pass pass:vidi2026pass --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "../$APK_FILE_NAME" || true
            fi
          fi

      # ========================================================================
      # الخطوة الخامسة: رفع ملف الـ APK في قسم Artifacts داخل صفحة Actions
      # ========================================================================
      - name: Upload APK to Actions Artifacts (رفع نسخة في صفحة Actions)
        uses: actions/upload-artifact@v4
        with:
          name: vidi-apk-v2.3
          path: ${{ env.APK_FILE_NAME }}

      # ========================================================================
      # الخطوة السادسة: نشر ملف vidi.apk مباشرة في صفحة Releases للتحميل بضغطة زر
      # ========================================================================
      - name: Publish APK to GitHub Releases (نشر التحميل المباشر في Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_PREFIX }}.${{ github.run_number }}
          name: "vidi ${{ env.APP_VERSION_PREFIX }} Android APK (Build #${{ github.run_number }})"
          body: "اضغط على ملف **vidi.apk** بالأسفل لتحميل وتثبيت النسخة المحدثة (${{ env.APP_VERSION_PREFIX }}) مباشرة على جوالك."
          files: ${{ env.APK_FILE_NAME }}
