name: Build vidi v2.1 APK (Signed Release)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Flutter Android project, install Tajawal Font & unpack vidi v2.1
        shell: bash
        run: |
          flutter create --platforms=android --org com.hussain --project-name vidi vidi_build
          cd vidi_build
          mkdir -p assets/fonts assets/images
          FALLBACK_FONT=$(find /usr/share/fonts -iname "*kufi*regular*.ttf" -o -iname "*.ttf" | head -n 1)
          curl -fsSL -o assets/fonts/AppFont-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Regular.ttf" || cp "$FALLBACK_FONT" assets/fonts/AppFont-Regular.ttf
          curl -fsSL -o assets/fonts/AppFont-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Medium.ttf" || cp assets/fonts/AppFont-Regular.ttf assets/fonts/AppFont-Medium.ttf
          curl -fsSL -o assets/fonts/AppFont-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Bold.ttf" || cp assets/fonts/AppFont-Regular.ttf assets/fonts/AppFont-SemiBold.ttf
          curl -fsSL -o assets/fonts/AppFont-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Bold.ttf" || cp assets/fonts/AppFont-Regular.ttf assets/fonts/AppFont-Bold.ttf
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cat << "EOF_PAYLOAD" | tr -d " \n\r" | base64 -d | tar -xJ -f -
