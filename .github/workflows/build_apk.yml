# ==============================================================================
# ملف البناء التلقائي لتطبيق vidi (الإصدار v2.3)
# ------------------------------------------------------------------------------
# شرح طريقة عمل هذا الملف باللغة العربية:
# هذا الملف مكتوب بلغة YAML الخاصة بخدمة (GitHub Actions)، ووظيفته تشغيل سيرفر
# سحابي مجاني يقوم بتجهيز بيئة أندرويد وفلاتر، واستخراج كود التطبيق، وتوقيعه،
# ثم إخراج ملف (vidi.apk) النهائي ووضعه في صفحة Releases لتحميله على جوالك.
# ==============================================================================

name: Build vidi v2.3 APK (Arabic Documented Builder)

# ------------------------------------------------------------------------------
# 1. متى يعمل هذا الملف؟ (Triggers)
# يعمل تلقائياً في حالتين:
# - push: بمجرد حفظ أي تعديل (Commit) على هذا الملف في أي فرع.
# - workflow_dispatch: يتيح لك تشغيله يدوياً بضغطة زر من صفحة Actions.
# ------------------------------------------------------------------------------
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

# ------------------------------------------------------------------------------
# 2. صلاحيات المستودع (Permissions)
# نمنح السيرفر صلاحية الكتابة (write) لكي يتمكن من إنشاء إصدار جديد في قسم
# Releases ورفع ملف vidi.apk بداخله تلقائياً.
# ------------------------------------------------------------------------------
permissions:
  contents: write

# ------------------------------------------------------------------------------
# 3. إعدادات متغيرة يمكنك تعديلها بسهولة (Editable Variables)
# إذا أردت تغيير اسم ملف الـ APK أو رقم الإصدار أو رابط الخط العربي مستقبلاً،
# يمكنك تعديل القيم الموجودة هنا فقط دون لمس بقية الكود!
# ------------------------------------------------------------------------------
env:
  # اسم ملف الـ APK النهائي الذي سيظهر لك عند التحميل:
  APK_FILE_NAME: "vidi.apk"
  # رقم الإصدار الرئيسي للتطبيق:
  APP_VERSION_PREFIX: "v2.3"
  # اسم الحزمة البرمجية للتطبيق في نظام أندرويد:
  ANDROID_ORG_PACKAGE: "com.hussain"
  # روابط تحميل خط (Tajawal) العربي المميز والخفيف:
  FONT_REGULAR_URL: "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Regular.ttf"
  FONT_MEDIUM_URL: "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Medium.ttf"
  FONT_BOLD_URL: "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Bold.ttf"

jobs:
  build-apk:
    # تشغيل عملية البناء على خادم لينكس (Ubuntu) سريع ومجاني من GitHub
    runs-on: ubuntu-latest

    steps:
      # ========================================================================
      # الخطوة الأولى: تثبيت حزمة جافا (Java JDK 17) الضرورية لبناء تطبيقات أندرويد
      # ========================================================================
      - name: Set up JDK 17 (تثبيت بيئة جافا 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ========================================================================
      # الخطوة الثانية: تثبيت إطار عمل Flutter (الإصدار المستقر Stable)
      # ========================================================================
      - name: Set up Flutter (تثبيت بيئة فلاتر)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ========================================================================
      # الخطوة الثالثة: إنشاء هيكل المشروع وتحميل الخط العربي وفك ملفات التطبيق
      # ملاحظة: السطور المشفرة بين (EOF_PAYLOAD) تحتوي على ملفات المشروع:
      # - lib/main.dart (الواجهات، المعرض، البحث اللحظي، الإعدادات، المجلدات)
      # - lib/video_service.dart (الفرز المستقل للمعرض والرئيسية، الحفظ الدائم)
      # - lib/video_player_item.dart (المشغل، زر المشاركة، زر التفاصيل i، التقريب)
      # - MainActivity.kt & VidiNotificationReceiver.kt (الإشعارات الفورية والملفات)
      # ========================================================================
      - name: Unpack Project & Fonts (فك ملفات المشروع وتجهيز الخطوط والأيقونة)
        shell: bash
        run: |
          # 1. إنشاء مشروع أندرويد نظيف باسم vidi
          flutter create --platforms=android --org "$ANDROID_ORG_PACKAGE" --project-name vidi vidi_build
          cd vidi_build
          mkdir -p assets/fonts assets/images

          # 2. تحميل خط Tajawal العربي الخفيف والمميز (مع خط احتياطي في حال انقطاع الرابط)
          FALLBACK_FONT=$(find /usr/share/fonts -iname "*kufi*regular*.ttf" -o -iname "*.ttf" | head -n 1)
          curl -fsSL -o assets/fonts/AppFont-Regular.ttf "$FONT_REGULAR_URL" || cp "$FALLBACK_FONT" assets/fonts/AppFont-Regular.ttf
          curl -fsSL -o assets/fonts/AppFont-Medium.ttf "$FONT_MEDIUM_URL" || cp assets/fonts/AppFont-Regular.ttf assets/fonts/AppFont-Medium.ttf
          curl -fsSL -o assets/fonts/AppFont-SemiBold.ttf "$FONT_BOLD_URL" || cp assets/fonts/AppFont-Regular.ttf assets/fonts/AppFont-SemiBold.ttf
          curl -fsSL -o assets/fonts/AppFont-Bold.ttf "$FONT_BOLD_URL" || cp assets/fonts/AppFont-Regular.ttf assets/fonts/AppFont-Bold.ttf

          # 3. إزالة الأيقونة الافتراضية لكي تظهر أيقونة vidi العنابية الجديدة
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 4. فك ضغط ملفات الكود واللوجو المدمجة بصيغة Base64
