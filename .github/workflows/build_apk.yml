      - name: Build vidi.apk (Release v2.0)
        working-directory: vidi_build
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../vidi.apk

      - name: Upload vidi.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidi-apk-v2
          path: vidi.apk

      - name: Publish Direct Downloadable vidi.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "vidi v2.0 Android APK (Build #${{ github.run_number }})"
          body: "اضغط على ملف **vidi.apk** بالأسفل لتحميل وتثبيت النسخة المحدثة (v2.0) مباشرة على جوالك."
          files: vidi.apk
