تعريب برنامج مستودع Vidi
محادثة مع Gemini
Act as an expert Flutter developer and build a complete, production-ready Android video player app named "vidi" with a TikTok-style vertical scrolling interface. The app must be fully structured with clean architecture, offline-first behavior, and support local storage. Implement all the following specifications in extreme detail:



UI & Theme:
A gorgeous dark and light theme toggle across the entire app with a deep burgundy and white color palette (#2A000A for dark, #FDF8F9 for light).
Custom local font support using 'AppFont' (.otf/.ttf) integrated natively without internet dependency.
A floating bottom navigation bar shaped like a pill/notch with two halves (Home on the right, Gallery on the left), and a prominent floating "+" button in the absolute center with a lighter burgundy background extended slightly upward.
A custom 2-second Splash Screen on launch displaying a small elegant app logo in the center with the text "Design by hussain" in a darker, refined font below it.


2. Video Service & Media Handling (Photo Manager):

Request read video permissions seamlessly without forcing the user to system settings.
Fetch ALL videos from the device's storage across all folders without any limits or caps using PhotoManager.
Default sort order upon opening the app must be RANDOM shuffle.
Pull-to-refresh mechanism on the first video of the "Home" tab to reshuffle and load a brand-new random set of videos instantly.
A comprehensive filter bottom sheet to sort videos by Date (Newest/Oldest) and Duration (All, Short under 1 min, Long over 1 min).


3. Video Player Item & Interactive UI:

Safe controller initialization/disposal to prevent any memory leaks or app crashes during rapid vertical swiping.
Display each video in its exact native aspect ratio (e.g., 4:3 or original dimensions) without forced cropping or stretching, maintaining a letterbox/pillarbox look if necessary.
Landscape video support: If a video is in landscape format, show a small "Landscape Video" button with a rotation icon; tapping it toggles full-screen rotation.
Play/Pause toggle on center screen tap.
Double-tap anywhere on the video to trigger a fast, sleek custom burgundy heart animation and toggle the video into the "Favorites" list.
A small heart icon appearing at the bottom-left corner of the video only if it is marked as a favorite.
Mute/Unmute button that appears directly beneath the pause icon in the center only when the video is paused.
Fast-forward 2x speed feature when pressing and holding on the far left or far right edges of the video screen.
A sleek minimal video progress bar at the bottom showing real-time playback progress without numbers.
Video title and description neatly positioned at the bottom-right with balanced, readable typography.


4. Persistence & Custom Albums ("Custom" Tab & "Favorites" Tab):

Full persistent local storage using SharedPreferences so favorites and custom albums are never forgotten after closing the app.
Custom Tab ("مخصص"): Allows users to view created custom folders/albums. Tapping the "+" tab opens an album creation screen where the user can type a folder name AND multi-select specific videos from a visual grid of the gallery before saving.
Favorites Tab ("لي"): Displays a vertical TikTok-style swipe feed of all favorited videos.
Gallery Tab: Displays all device videos in a structured 3-column grid format.


Ensure all three core files (main.dart, video_service.dart, and video_player_item.dart) are fully coded with robust error handling, null safety, and zero syntax bugs, fully ready to compile into a high-performance Android APK.

