      - name: Build & Sign Production Release APK (v1 + v2 + v3 Signature)
        working-directory: vidi_build
        shell: bash
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../vidi.apk
          keytool -genkeypair -v -keystore release.jks -alias vidi_release -keyalg RSA -keysize 2048 -validity 10000 -storepass vidi2026pass -keypass vidi2026pass -dname "CN=Hussain Al-dmini, OU=AppDev, O=vidi, L=Sanaa, S=Sanaa, C=YE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" sign --ks release.jks --ks-key-alias vidi_release --ks-pass pass:vidi2026pass --key-pass pass:vidi2026pass --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true ../vidi.apk
          fi

      - name: Upload vidi.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidi-apk-v2.1
          path: vidi.apk

      - name: Publish Direct Downloadable vidi.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: "vidi v2.1 Android APK (Build #${{ github.run_number }})"
          body: "اضغط على ملف **vidi.apk** بالأسفل لتحميل وتثبيت النسخة المحدثة (v2.1) مباشرة على جوالك."
          files: vidi.apk
