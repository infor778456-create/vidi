البرنامج جميل لكن من عيوبه ، والتعديلات كمان هي :



اول ما المستخدم يطلع من البرنامج ويحذف نافذة البرنامج ، قوائم التشغيل المخصصه الي انشأها المستخدم داخل البرنامج غير موجوده يعني انو تنحذف مجرد ما المستخدم يطلع ويحذف النافذه الخاصه بالتطبيق



اللايك ، عندما يضغط المستخدم مرتين على الشاشه ينضغط اللايك ، لكن اذا ضغط مرتين للمرة ثانيه يشيل اللايك ، انا الغى ماينشال اللايك الا اذا المستخدم ضغط على علامة اللايك ،



تبويب المعرض ، ابغى يكون قابل ايضا للفرز (بنفس طريقة الصفحه الرئيسيه) ،



لوجو البرنامج ، او صورة البرنامج (الصورة المرفقه) ، طبعا هذا رح يكون صورة ايقونه البرنامج وكمان الي حتطلع بالشاشه الافتتاحيه ، الشاشه الافتتاحيه ممنوع تطول اكثر من ثانيتين ونص



التقليب بسلاسه ، طريقة التقليب حاليا جيده لكنها غير سلسه او سريعه بما يرضي المستخدم ، لذلك حسنها ،



لغة التطبيق، الخطأ الاكبر هو ان لغة التطبيق حاليا باللغة الانجليزية ، اللغة الإفتراضيه لازم تكون العربيه



خط التطبيق. بعد تغيير اللغة للغه العربيه ، الخط لازم يكون مميز (ممنوع يكون افتراضي ) لازم يكون مميز شوي وخفيف



زر الكتم وزر تدوير الفيديو لازم يكونو تحت مستوى نصف الشاشه



الايقونات لازم يكونو اكثر حداثه ، مثال على ذلك الشكل الي يطلع لك عند ايقاف الفيديو ، (علامة خطين عموديين ) ، مشكلة هذا الشكل انه داخل دائرة حمراء ، رغم انه من الممكن انو يكون بدون الدائره الحمراء هذي بشرط تكبير الشكل شوي ليكون واضح للمستخدم , ويطبق هذا على بقية الأشكال (الاشكال الي يلاحض عليها المستخدم وليس كلها )



ميزة ايقاف الفيديو المؤقت ، مجرد ما المستخدم يضغط مطولا على الشاشه اثناء تشغيل الفيديو(اذا اتجاوز الثانيه وهو ضاغط على الشاشه ) الفيديو يتوقف بس بدون مايطلع على الشاشه كلا من : علامة الأيقاف،علامة الكتم، علامة التدوير اذا كان عرض،علامة اللايك اذا كان تم وضعه في المفضله ، الكتابه الي تحت( عنوان الفيديو والتفاصيل )،علامة شريط التقدم





شريط التقدم ، اثناء ما المستخدم يمرر اصبعه على شريط التقدم (للتقديم او لرجوع للخلف) الفيديو يضل شغال ومايتوقف ، وكمان اثناء التمرير لازم يطلع عداد ثلاثي يطلع لك اصبعك الان بأي ثانية من المقطع (عداد يحسب الساعات والدقائق والثواني)





تقريب الفيديو ، اضافة ميزة امكانية تقريب الفيديو اثناء المشاهده (وليس عندما يكون متوقفا) ، يمسك المستخدم بإصبعين ويقرب الفيديو ، مجرد ما يفلت المستخدم اليدين الفيديو يرجع لوضعه الطبيعي



كمان في شي ضروري وخطأ فادح في التطبيق ، هذا الخطأ هو ان الشاشه تطفي بوجه المستخدم في حال كان هاتف المستخدم مشغلا لوضع السكون التلقائي ، هذا الخطأ لازم يتصلح والمفروض الشاشه ماتنطفى طالما ان مقطع الفيديو شغال



