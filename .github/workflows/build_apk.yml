أبرز التعديلات التي تمت إضافتها في الإصدار الجديد (v2.0)
حفظ دائم وفوري لقوائم التشغيل المخصصة (مخصص) والمفضلة: تمت إضافة حفظ متزامن ثلاثي الطبقات (عبر نظام الملفات الأصلي لأندرويد filesDir + SharedPreferences.commit() الفوري) بحيث لا تُحذف قوائم التشغيل المخصصة أبداً حتى عند إغلاق التطبيق وحذف نافذته فوراً.

تعديل سلوك الإعجاب (اللايك): الضغط مرتين على الشاشة يضيف الفيديو للمفضلة فقط مع أنيميشن القلب ولا يزيل الإعجاب لو ضغطت مرتين مرة أخرى؛ ولا يُزال الإعجاب إلا عند الضغط المباشر على علامة القلب في أسفل يسار الفيديو.

فرز وتصفية تبويب المعرض (المعرض): أصبح زر الفرز العلوي يعمل في تبويب المعرض بنفس طريقة الصفحة الرئيسية (خلط عشوائي، الأحدث، الأقدم، وتصفية المدة).

شعار وأيقونة التطبيق الجديدة وشاشة البداية: تم اعتماد اللوجو المرفق كأيقونة رسمية للتطبيق على شاشة الهاتف الرئيسية وفي شاشة البداية وقسم "حول vidi"، مع ضبط مدة الشاشة الافتتاحية على 1.9 ثانية (أقل من ثانيتين ونصف).

تقليب سريع وسلس واللغة العربية والخط المميز:

ضبط اللغة العربية كلغة افتراضية للتطبيق بالكامل مع تضمين خط Tajawal العربي المميز والخفيف.

إضافة فيزياء تمرير مخصصة سريعة الاستجابة (VidiFastPageScrollPhysics) مع عرض فوري للصورة المصغرة لمنع أي تقطيع أثناء التقليب السريع.

أيقونات حديثة بدون دوائر حمراء ومواضع الأزرار:

استبدال الأيقونات القديمة بأيقونات حديثة مكبرة وواضحة بدون الدائرة الحمراء خلفها.

وضع زر الكتم وزر تدوير الفيديو تحت مستوى منتصف الشاشة.

ميزة الإيقاف المؤقت النظيف (الضغط المطول لأكثر من ثانية): عند الضغط المطول على الشاشة لأكثر من ثانية أثناء تشغيل الفيديو، يتوقف الفيديو مؤقتاً وتختفي جميع العناصر من الشاشة (علامة الإيقاف، الكتم، التدوير، القلب، العنوان والتفاصيل، وشريط التقدم) لمشاهدة اللقطة صافية تماماً، ويعود التشغيل فور رفع الإصبع.

شريط التقدم مع العداد الثلاثي (HH:MM:SS) وتقريب الفيديو ومنع انطفاء الشاشة:

استمرار الفيديو بالعمل دون توقف أثناء تمرير الإصبع على شريط التقدم مع ظهور عداد ثلاثي (الساعات:الدقائق:الثواني) يوضح الثانية الحالية بدقة.

إمكانية تقريب الفيديو بإصبعين (Pinch-to-Zoom) أثناء المشاهدة فقط (وليس عند الإيقاف)، وعودته تلقائياً لوضعه الطبيعي بمجرد إفلات اليدين.

تفعيل قفل الشاشة الأصلي (FLAG_KEEP_SCREEN_ON) لمنع انطفاء شاشة الهاتف نهائياً طالما الفيديو قيد التشغيل.

جدولة الإشعارات اليومية والأسبوعية تلقائياً:

إشعار يومي الساعة 9:00 صباحاً يختار كل يوم رسالة جديدة من رسائل الصباح الـ 15 المحددة.

إشعار يومي الساعة 8:00 مساءً يختار كل يوم رسالة جديدة من رسائل المساء الـ 7 المحددة.

إشعار كل يوم جمعة الساعة 1:00 ظهراً (رسالة سورة الكهف والجمعة المباركة)، وإشعار كل يوم خميس الساعة 4:30 عصراً (كيف جعل مايكيف غيرك 🫡🌿🌿).

زر وواجهة الإعدادات الجديدة (أقصى يسار الشريط السفلي):

تصميم مستوحى من الواجهة المرفقة يضم الأقسام الأربعة: المظهر والتخصيص (داكن/فاتح/تلقائي، اللغة العربية/الإنجليزية، لون الواجهة برغندي أو ألوان أخرى)، قسم التشغيل (التقليب التلقائي، تكرار الفيديو، كتم الصوت افتراضياً، تذكر آخر موضع)، قسم الإشعارات (إشعارات صباح ومساء، وإشعارات ساكتة)، وقسم حول vidi (الشعار والإصدار، Design by Hussain Al-dmini، سياسة الخصوصية، مشاركة التطبيق كملف APK، وحسابات التواصل Instagram: 1is3n وFacebook: 1is3n وGmail: infor778456@gmail.com).

كيف تستخرج ملف الـ APK المحدّث الآن من جوالك؟
افتح صفحة تعديل ملف البناء في مستودعك مباشرة: تعديل build_apk.yml في GitHub (أو ادخل للملف واضغط أيقونة القلم ✏️).

امسح المحتوى القديم بالكامل، وانسخ محتوى ملف build_apk.yml المرفق أعلاه والصقه مكانه ثم اضغط Commit changes.

انتظر دقيقتين ثم افتح صفحة Releases لتحميل vidi.apk وستجد الإصدار الجديد v2.0 جاهزاً للتثبيت.





