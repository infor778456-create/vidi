name: Build vidi APK (Mobile One-File Builder)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Flutter Android project & unpack vidi source files
        shell: bash
        run: |
          flutter create --platforms=android --org com.hussain --project-name vidi vidi_build
          cd vidi_build
          mkdir -p assets/fonts
          FONT_SRC=$(find /usr/share/fonts -name "*.ttf" | head -n 1)
          for w in Regular Medium SemiBold Bold ExtraBold; do
            cp "$FONT_SRC" "assets/fonts/AppFont-$w.ttf"
          done
          cat << "EOF_PAYLOAD" | tr -d " \n\r" | base64 -d | tar -xJ -f -
