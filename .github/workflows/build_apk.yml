      - name: Build vidi.apk (Release)
        working-directory: vidi_build
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../vidi.apk

      - name: Upload vidi.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidi-apk
          path: vidi.apk

      - name: Publish Direct Downloadable vidi.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "vidi Android APK (v1.0.${{ github.run_number }})"
          body: "اضغط على ملف **vidi.apk** بالأسفل لتحميل وتثبيت التطبيق مباشرة على جوالك."
          files: vidi.apk
